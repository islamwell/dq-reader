buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'com.google.gms:google-services:4.4.0'
    }
}

ext {
    // Raise minSdk to satisfy ionfilesystem dependency
    minSdkVersion = 23
    targetSdkVersion = 34
    compileSdkVersion = 34

    // Example androidx versions (keep yours if already set elsewhere)
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    coreSplashScreenVersion = '1.0.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Keep flatDir for cordova plugin shims if you rely on local AARs/JARs
        flatDir {
            dirs 'capacitor-cordova-android-plugins/src/main/libs', 'libs'
        }
    }
}