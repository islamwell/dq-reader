workflows:
  # Android Build Workflow
  android-workflow:
    name: Android Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      android_signing:
        - dq_reader_keystore
      groups:
        - firebase_credentials
      vars:
        PACKAGE_NAME: "com.nurulquran.dq"
        VITE_FIREBASE_API_KEY: $FIREBASE_API_KEY
        VITE_FIREBASE_AUTH_DOMAIN: $FIREBASE_AUTH_DOMAIN
        VITE_FIREBASE_PROJECT_ID: $FIREBASE_PROJECT_ID
        VITE_FIREBASE_STORAGE_BUCKET: $FIREBASE_STORAGE_BUCKET
        VITE_FIREBASE_MESSAGING_SENDER_ID: $FIREBASE_MESSAGING_SENDER_ID
        VITE_FIREBASE_APP_ID: $FIREBASE_APP_ID
        VITE_FIREBASE_MEASUREMENT_ID: $FIREBASE_MEASUREMENT_ID
      node: 20.11.0
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'develop'
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Create .env file
        script: |
          cat > .env << EOF
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          VITE_FIREBASE_MEASUREMENT_ID=$VITE_FIREBASE_MEASUREMENT_ID
          EOF
      - name: Build web assets
        script: |
          npm run build
      - name: Update dependencies and copy web assets to native project
        script: |
          npx cap sync android
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build Android release
        script: |
        # Ensure google-services.json exists
          if [ ! -f "$CM_BUILD_DIR/android/app/google-services.json" ]; then
            echo "WARNING: google-services.json not found!"
            echo "Make sure to add it to your repository at: android/app/google-services.json"
            exit 1
          fi
          
# Make gradlew executable
          cd android
          chmod +x gradlew

# Build release APK
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - it@nrq.no
        notify:
          success: true
          failure: true


  # iOS Build Workflow
  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: dq_reader_api_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nurulquran.dq
      groups:
        - firebase_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.nurulquran.dq"
        APP_STORE_APPLE_ID: 1234567890 # Replace with your App Store ID
        VITE_FIREBASE_API_KEY: $FIREBASE_API_KEY
        VITE_FIREBASE_AUTH_DOMAIN: $FIREBASE_AUTH_DOMAIN
        VITE_FIREBASE_PROJECT_ID: $FIREBASE_PROJECT_ID
        VITE_FIREBASE_STORAGE_BUCKET: $FIREBASE_STORAGE_BUCKET
        VITE_FIREBASE_MESSAGING_SENDER_ID: $FIREBASE_MESSAGING_SENDER_ID
        VITE_FIREBASE_APP_ID: $FIREBASE_APP_ID
        VITE_FIREBASE_MEASUREMENT_ID: $FIREBASE_MEASUREMENT_ID
      node: 20.11.0
      xcode: 15.2
      cocoapods: default
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'develop'
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Create .env file
        script: |
          cat > .env << EOF
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          VITE_FIREBASE_MEASUREMENT_ID=$VITE_FIREBASE_MEASUREMENT_ID
          EOF
      - name: Build web assets
        script: |
          npm run build
      - name: Update dependencies and copy web assets to native project
        script: |
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - it@nrq.no
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false

  # Web Build Workflow (for hosting on Vercel/Netlify/Firebase)
  web-workflow:
    name: Web Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - firebase_credentials
      vars:
        VITE_FIREBASE_API_KEY: $FIREBASE_API_KEY
        VITE_FIREBASE_AUTH_DOMAIN: $FIREBASE_AUTH_DOMAIN
        VITE_FIREBASE_PROJECT_ID: $FIREBASE_PROJECT_ID
        VITE_FIREBASE_STORAGE_BUCKET: $FIREBASE_STORAGE_BUCKET
        VITE_FIREBASE_MESSAGING_SENDER_ID: $FIREBASE_MESSAGING_SENDER_ID
        VITE_FIREBASE_APP_ID: $FIREBASE_APP_ID
        VITE_FIREBASE_MEASUREMENT_ID: $FIREBASE_MEASUREMENT_ID
      node: 20.11.0
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'develop'
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Create .env file
        script: |
          cat > .env << EOF
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          VITE_FIREBASE_MEASUREMENT_ID=$VITE_FIREBASE_MEASUREMENT_ID
          EOF
      - name: Build web application
        script: |
          npm run build
      - name: Run tests
        script: |
          npm run test || true
    artifacts:
      - dist/**
    publishing:
      email:
        recipients:
          - it@nrq.no
        notify:
          success: true
          failure: true
